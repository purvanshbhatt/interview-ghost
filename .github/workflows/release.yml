name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically trigger when you push a new version tag (e.g., v0.2.0)
  workflow_dispatch: # Allow manual release triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    env:
      # A runner with no certificate can only produce an ad-hoc macOS build, and
      # macOS refuses those after a download. Publishing one would overwrite a
      # signed release asset with an unopenable one, so the mac upload below is
      # gated on this. Set CSC_LINK and the APPLE_* secrets to turn it on.
      MAC_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder.cjs signs and notarizes only when MAC_SIGN=1; without
          # these it still builds ad-hoc, so the job keeps working as a build check.
          MAC_SIGN: ${{ secrets.CSC_LINK != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux x64 and arm64
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux && npm run dist:linux:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ship local whisper.cpp transcription inside the Linux AppImages/debs.
          # The runtime manifest pins linux-x64/linux-arm64 prebuilt archives,
          # so no cmake toolchain is needed on the runner.
          CUE_BUNDLE_WHISPER: '1'

      - name: Upload to GitHub Release
        # Skipped on macOS until signing is configured, so an ad-hoc build can
        # never replace a signed asset already attached to the release.
        if: matrix.os != 'macos-latest' || env.MAC_SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Build Android APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug
          mkdir -p ../../dist
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../../dist/ghost-mobile-release.apk \;

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ghost-mobile-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


