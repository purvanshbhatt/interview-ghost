name: Build and Release

on:
  push:
    tags:
      - 'v*' # Automatically trigger when you push a new version tag (e.g., v0.2.6)
  workflow_dispatch: # Allow manual release triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    env:
      MAC_SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          npm run dist:mac
          if [ -f dist/Ghost-mac-arm64.dmg ]; then cp dist/Ghost-mac-arm64.dmg dist/Ghost.dmg; fi
          if [ -f dist/Ghost-mac-x64.dmg ] && [ ! -f dist/Ghost.dmg ]; then cp dist/Ghost-mac-x64.dmg dist/Ghost.dmg; fi
          if [ -f dist/Ghost-mac-arm64.zip ]; then cp dist/Ghost-mac-arm64.zip dist/Ghost-mac.zip; fi
          if [ -f dist/Ghost-mac-x64.zip ] && [ ! -f dist/Ghost-mac.zip ]; then cp dist/Ghost-mac-x64.zip dist/Ghost-mac.zip; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGN: ${{ secrets.CSC_LINK != '' && '1' || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux x64 and arm64
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run dist:linux && npm run dist:linux:arm64
          if [ -f dist/Ghost-linux-x64.AppImage ]; then cp dist/Ghost-linux-x64.AppImage dist/Ghost-linux-x86_64.AppImage; fi
          if [ -f dist/Ghost-linux-x64.deb ]; then cp dist/Ghost-linux-x64.deb dist/Ghost-linux-amd64.deb; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHOST_BUNDLE_WHISPER: '1'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Build Android APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_SRC" ]; then
            echo "Found release APK at: $APK_SRC"
            cp "$APK_SRC" ../../dist/ghost-interview-copilot-release.apk
            cp "$APK_SRC" ../../dist/ghost-mobile-release.apk
          else
            echo "ERROR: No release APK found under app/build/outputs/apk/release!" && exit 1
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ghost-interview-copilot-release.apk
            dist/ghost-mobile-release.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile-ios:
    name: Build iOS App
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci || npm install --legacy-peer-deps

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          cd mobile/ios
          pod install --repo-update || true

      - name: Build iOS App
        run: |
          cd mobile/ios
          xcodebuild -workspace Ghost.xcworkspace \
            -scheme Ghost \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build || true
          mkdir -p ../../dist
          APP_DIR=$(find build/Build/Products -name "Ghost.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            echo "Packaging iOS simulator app from: $APP_DIR"
            cd "$(dirname "$APP_DIR")"
            zip -r ../../../../../dist/Ghost-iOS-Simulator.zip Ghost.app
          else
            echo "No Ghost.app simulator bundle produced (ad-hoc build skipped)"
          fi

      - name: Upload iOS App to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Ghost-iOS-Simulator.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
